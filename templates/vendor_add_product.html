{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

{% include 'extend-files/navbar.html' %}


<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header">

                    <h3 class="mb-0">
                        Add New Product
                    </h3>

                    <p class="text-muted mb-0">
                        Add a product to your store
                    </p>

                </div>


                <div class="card-body">




                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}


                        <!-- Product Name -->

                        <div class="form-group">

                            <label for="product_name">
                                Product Name
                            </label>

                            <input type="text"
                                   id="product_name"
                                   name="product_name"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   required>

                        </div>


                        <!-- Description -->

                        <div class="form-group">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description"
                                      name="description"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Enter product description"
                                      required></textarea>

                        </div>


                        <!-- Price -->

                        <div class="form-group">

                            <label for="price">
                                Price
                            </label>

                            <input type="number"
                                   id="price"
                                   name="price"
                                   class="form-control"
                                   placeholder="Enter price"
                                   step="0.01"
                                   min="0"
                                   required>

                        </div>


                        <!-- GST slab -->

                        <div class="form-group">

                            <label for="gst_rate">
                                GST Slab
                            </label>

                            <select id="gst_rate" name="gst_rate" class="form-control">
                                {% for value, label in gst_choices %}
                                    <option value="{{ value }}" {% if value == default_gst_rate %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>

                            <small class="form-text text-muted">
                                Quotations for this product start from this GST rate.
                            </small>

                        </div>


                        <!-- Stock -->

                        <div class="form-group">

                            <label for="stock">
                                Stock
                            </label>

                            <input type="number"
                                   id="stock"
                                   name="stock"
                                   class="form-control"
                                   placeholder="Enter available quantity"
                                   min="0"
                                   required>

                        </div>


                        <!-- Product Image -->

                        <div class="form-group">

                            <label for="images">
                                Product Image
                            </label>

                            <input type="file"
                                   id="images"
                                   name="images"
                                   class="form-control-file"
                                   accept="image/*"
                                   required>

                        </div>


                        <!-- Category -->

                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select id="category"
                                    name="category"
                                    class="form-control">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics">
                                    Electronics
                                </option>

                                <option value="Fashion">
                                    Fashion
                                </option>

                                <option value="Home">
                                    Home
                                </option>

                                <option value="Beauty">
                                    Beauty
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Submit -->

                        <button type="submit"
                                class="btn btn-success">

                            Add Product

                        </button>


                        <a href="{% url 'vendor_dashboard' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


{% include 'extend-files/footer.html' %}


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
