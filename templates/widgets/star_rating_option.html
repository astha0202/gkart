<input type="{{ widget.type }}"
       name="{{ widget.name }}"
       value="{{ widget.value }}"
       {% if widget.attrs.id %}id="{{ widget.attrs.id }}"{% endif %}
       {% if widget.attrs.checked %}checked{% endif %}
       {% if widget.attrs.required %}required{% endif %}
       class="star-input">
<label {% if widget.attrs.id %}for="{{ widget.attrs.id }}"{% endif %}
       class="star-label"
       title="{{ widget.label }} star{{ widget.label|pluralize }}">&#9733;</label>
