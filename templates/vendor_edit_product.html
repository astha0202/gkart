{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

{% include 'extend-files/navbar.html' %}


<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-header">

                    <h3 class="mb-0">
                        Edit Product
                    </h3>

                </div>


                <div class="card-body">



                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="form-group">

                            <label for="product_name">
                                Product Name
                            </label>

                            <input type="text"
                                   id="product_name"
                                   name="product_name"
                                   class="form-control"
                                   value="{{ product.product_name }}"
                                   required>

                        </div>
                        <div class="form-group">

                            <label for="description">
                                Description
                            </label>

                            <textarea id="description"
                                      name="description"
                                      class="form-control"
                                      rows="4"
                                      required>{{ product.description }}</textarea>

                        </div>
                        <div class="form-group">

                            <label for="price">
                                Price
                            </label>

                            <input type="number"
                                   id="price"
                                   name="price"
                                   class="form-control"
                                   value="{{ product.price }}"
                                   step="0.01"
                                   min="0"
                                   required>

                        </div>

                        <div class="form-group">

                            <label for="gst_rate">
                                GST Slab
                            </label>

                            <select id="gst_rate" name="gst_rate" class="form-control">
                                {% for value, label in gst_choices %}
                                    <option value="{{ value }}" {% if value == product.gst_rate %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>

                        </div>

                        <div class="form-group">

                            <label for="stock">
                                Stock
                            </label>

                            <input type="number"
                                   id="stock"
                                   name="stock"
                                   class="form-control"
                                   value="{{ product.stock }}"
                                   min="0"
                                   required>

                        </div>


                        <div class="form-group">

                            <label>
                                Current Product Image
                            </label>

                            <br>

                            {% if product.images %}

                                <img src="{{ product.images.url }}"
                                     alt="{{ product.product_name }}"
                                     style="width: 150px;
                                            height: 150px;
                                            object-fit: contain;">

                            {% else %}

                                <p class="text-muted">
                                    No image available
                                </p>

                            {% endif %}

                        </div>

                        <div class="form-group">

                            <label for="images">
                                Change Product Image
                            </label>

                            <input type="file"
                                   id="images"
                                   name="images"
                                   class="form-control-file"
                                   accept="image/*">

                            <small class="text-muted">
                                Leave empty if you don't want to change the image.
                            </small>

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <select id="category"
                                    name="category"
                                    class="form-control">

                                <option value="">
                                    Select Category
                                </option>

                                <option value="Electronics"
                                    {% if product.category == "Electronics" %}selected{% endif %}>
                                    Electronics
                                </option>

                                <option value="Fashion"
                                    {% if product.category == "Fashion" %}selected{% endif %}>
                                    Fashion
                                </option>

                                <option value="Home"
                                    {% if product.category == "Home" %}selected{% endif %}>
                                    Home
                                </option>

                                <option value="Beauty"
                                    {% if product.category == "Beauty" %}selected{% endif %}>
                                    Beauty
                                </option>

                                <option value="Books"
                                    {% if product.category == "Books" %}selected{% endif %}>
                                    Books
                                </option>

                                <option value="Other"
                                    {% if product.category == "Other" %}selected{% endif %}>
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Buttons -->

                        <button type="submit"
                                class="btn btn-primary">

                            Update Product

                        </button>


                        <a href="{% url 'vendor_products' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


{% include 'extend-files/footer.html' %}


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
