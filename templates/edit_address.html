{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Address</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>

{% include 'extend-files/navbar.html' %}


<div class="container mt-5 mb-5">

    <h2 class="mb-4">
        Edit Address
    </h2>


    <div class="card">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Address Line 1
                    </label>

                    <input type="text"
                           name="address_line_1"
                           class="form-control"
                           value="{{ address.address_line_1 }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Address Line 2
                    </label>

                    <input type="text"
                           name="address_line_2"
                           class="form-control"
                           value="{{ address.address_line_2 }}">

                </div>


                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input type="text"
                           name="city"
                           class="form-control"
                           value="{{ address.city }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input type="text"
                           name="state"
                           class="form-control"
                           value="{{ address.state }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Country
                    </label>

                    <input type="text"
                           name="country"
                           class="form-control"
                           value="{{ address.country }}"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Pincode
                    </label>

                    <input type="text"
                           name="pincode"
                           class="form-control"
                           value="{{ address.pincode }}"
                           required>

                </div>


                <div class="form-check mb-4">

                    <input type="checkbox"
                           name="is_default"
                           class="form-check-input"
                           id="defaultAddress"
                           {% if address.is_default %}checked{% endif %}>

                    <label class="form-check-label"
                           for="defaultAddress">

                        Make this my default address

                    </label>

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    Update Address

                </button>


                <a href="{% url 'address' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>


{% include 'extend-files/footer.html' %}


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
