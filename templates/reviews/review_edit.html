{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Review</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    {% include "extend-files/navbar.html" %}

    <div class="container mt-5 mb-5" style="max-width: 700px;">

        <h2 class="mb-4">Edit Review - {{ review.product.product_name }}</h2>


        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Your Rating</label><br>
                {{ form.rating }}
            </div>

            <div class="form-group">
                <label>{{ form.title.label }}</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>{{ form.body.label }}</label>
                {{ form.body }}
            </div>

            <a href="{% url 'product_detail' review.product.slug %}" class="btn btn-outline-secondary">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

        </form>

    </div>

    {% include "extend-files/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>

</body>

</html>
